{% include 'navigation.html' %}
{% load static %}

<div class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <span class="badge bg-info bg-opacity-10 text-info px-3 py-2 rounded-pill fw-bold mb-2">Get In Touch</span>
                        <h2 class="fw-bold text-dark mb-1">Contact Our Travel Desk</h2>
                        <p class="text-muted small">Have questions about monument entries, tour routes, or special passes?</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label text-dark fw-semibold small">Full Name</label>
                            <input type="text" class="form-control form-control-travel" name="fname" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-dark fw-semibold small">Email Address</label>
                            <input type="email" class="form-control form-control-travel" name="email" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-dark fw-semibold small">Contact Number</label>
                            <input type="tel" class="form-control form-control-travel" name="mobile" placeholder="Enter phone number" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-dark fw-semibold small">Message / Inquiry Purpose</label>
                            <textarea class="form-control form-control-travel" rows="4" name="purpose" placeholder="Describe your inquiry..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-travel-primary w-100 py-3 fs-6">
                            <i class="fa-solid fa-paper-plane me-2"></i> Submit Inquiry
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% if error == "no" %}
<script>
    alert("Thank you! Your message has been submitted successfully.");
    window.location = ('{% url 'contact_us' %}');
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Something went wrong. Please try again.");
</script>
{% endif %}

{% include 'footer.html' %}
