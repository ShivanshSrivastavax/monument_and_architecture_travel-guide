<!-- Toast Helper Script -->
<script>
    function showToast(message, type = 'info', redirectUrl = null) {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `toast-popup toast-${type}`;
        
        let icon = type === 'success' ? 'fa-check-circle text-success' : (type === 'error' ? 'fa-exclamation-circle text-danger' : 'fa-info-circle text-info');
        
        toast.innerHTML = `
            <div class="d-flex align-items-center gap-2">
                <i class="fa-solid ${icon} fs-5"></i>
                <span>${message}</span>
            </div>
            <button type="button" class="toast-close-btn" onclick="this.parentElement.remove()">&times;</button>
        `;

        container.appendChild(toast);

        setTimeout(() => {
            if (redirectUrl) {
                window.location = redirectUrl;
            } else {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }
        }, 2200);
    }
</script>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
