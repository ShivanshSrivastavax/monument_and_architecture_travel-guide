{% include 'user_navigation.html' %}
{% load static %}

<script>
    function checkpass() {
        if(document.changepassword.newpassword.value != document.changepassword.confirmpassword.value) {
            alert('New Password and Confirm Password do not match!');
            document.changepassword.newpassword.focus();
            return false;
        }
        return true;
    }
</script>

<div class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <span class="badge bg-info bg-opacity-10 text-info px-3 py-2 rounded-pill fw-bold mb-2">Account Security</span>
                        <h2 class="fw-bold text-dark mb-1">Change Password</h2>
                        <p class="text-muted small">Keep your traveler account safe and secure</p>
                    </div>

                    <form method="post" name="changepassword" onsubmit="return checkpass()">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label text-dark fw-semibold small">Current Password</label>
                            <input type="password" class="form-control form-control-travel" name="currentpassword" placeholder="Enter current password" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-dark fw-semibold small">New Password</label>
                            <input type="password" class="form-control form-control-travel" name="newpassword" placeholder="Enter new password" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-dark fw-semibold small">Confirm New Password</label>
                            <input type="password" class="form-control form-control-travel" name="confirmpassword" placeholder="Re-enter new password" required>
                        </div>

                        <button type="submit" class="btn btn-travel-primary w-100 py-3 fs-6">
                            <i class="fa-solid fa-key me-2"></i> Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% if error == "no" %}
<script>
    alert("Password Changed Successfully! Please log in again.");
    window.location = ('{% url 'logout' %}');
</script>
{% endif %}

{% if error == "not" %}
<script>
    alert("Your Current Password is incorrect.");
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Something went wrong. Please try again.");
</script>
{% endif %}

{% include 'footer.html' %}
